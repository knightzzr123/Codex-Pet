<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self'; script-src 'self'; connect-src 'none'">
  <title>大肥鱼 · Codex 额度小助手</title>
  <link rel="stylesheet" href="style.css">
  <script src="dialogue-data.js" defer></script>
  <script src="renderer.js" defer></script>
</head>
<body class="no-bubble">
  <main id="mascot" aria-label="Codex 窗口内额度角色">
    <div id="speech-anchor">
      <section id="bubble" class="interactive" tabindex="0" aria-label="鲸鱼娘对话和 Codex 额度，按回车说下一句，Esc 收起">
        <div id="dialogue-view" class="bubble-panel dialogue-view" inert aria-hidden="true">
          <button id="dialogue-next" aria-label="听鲸鱼娘说下一句">
            <span class="speaker">鲸鱼娘</span>
            <span id="dialogue" role="status" aria-live="polite">主人，戳戳我嘛～</span>
          </button>
        </div>
        <div id="quota-view" class="bubble-panel quota-view is-active" aria-hidden="false">
          <div class="heading"><span class="status-dot" id="status-dot"></span>Codex 剩余额度</div>
          <div class="hero-line" role="status" aria-live="polite" aria-atomic="true"><span id="remaining">—</span><span id="percent">%</span></div>
          <div id="period">正在读取账户额度</div>
          <div id="other-windows"></div>
          <div id="reset" class="reset">连接本机 Codex…</div>
          <div class="meta"><span id="updated">首次读取</span><button id="refresh" title="刷新额度" aria-label="刷新 Codex 额度">↻</button></div>
        </div>
      </section>
      <div class="thought-dot dot-one" aria-hidden="true"></div>
      <div class="thought-dot dot-two" aria-hidden="true"></div>
    </div>
    <span id="reaction" aria-hidden="true">♡</span>
    <div id="session-state" class="session-state" hidden aria-live="polite" aria-label="Codex 会话状态">
      <span class="session-dot" aria-hidden="true"></span>
      <span id="session-state-text">空闲</span>
    </div>
    <div id="session-toast" class="session-toast" hidden role="status" aria-live="polite"></div>
    <button id="pet" class="interactive" aria-label="点击查看额度，点击气泡说话，按住拖动，右键或触摸长按打开菜单" title="点击看额度 · 点气泡和我说话 · 按住拖动 · 右键或触摸长按打开菜单">
      <img id="pet-image" src="../assets/pet.png" alt="蓝发 Q 版女仆角色" draggable="false">
    </button>
    <aside id="settings-panel" class="settings-panel" hidden aria-hidden="true" aria-label="桌宠设置">
      <header class="settings-header">
        <h2>设置</h2>
        <button type="button" id="settings-close" class="settings-close" aria-label="关闭设置">×</button>
      </header>
      <p class="settings-intro">改动即时生效；每个分组和单项都能单独重置。</p>

      <section class="settings-section" data-settings-group="appearance" aria-labelledby="settings-appearance-title">
        <div class="settings-section-head">
          <h3 id="settings-appearance-title">外观</h3>
          <button type="button" class="settings-reset settings-reset-group" data-reset-group="appearance">重置本组</button>
        </div>
        <div id="settings-skins" class="settings-row settings-skins"></div>
        <button type="button" id="settings-import-skin" class="settings-action">导入图片…</button>
        <div class="settings-field settings-field-plain">
          <span class="settings-label">大小
            <button type="button" class="settings-reset" data-reset-key="sizeLevel" aria-label="重置大小">↺</button>
          </span>
          <span id="settings-size-value" class="settings-value">4 档</span>
        </div>
        <div id="settings-size" class="settings-size" role="radiogroup" aria-label="角色大小"></div>
      </section>

      <section class="settings-section" data-settings-group="dialogue" aria-labelledby="settings-dialogue-title">
        <div class="settings-section-head">
          <h3 id="settings-dialogue-title">对话</h3>
          <button type="button" class="settings-reset settings-reset-group" data-reset-group="dialogue">重置本组</button>
        </div>
        <button type="button" id="settings-edit-dialogues" class="settings-action">编辑台词…</button>
        <div class="settings-field settings-field-plain">
          <span class="settings-label">气泡停留
            <button type="button" class="settings-reset" data-reset-key="bubbleSeconds" aria-label="重置气泡停留">↺</button>
          </span>
          <span id="settings-bubble-seconds-value" class="settings-value">8 秒</span>
        </div>
        <div id="settings-bubble-seconds" class="settings-chips" role="radiogroup" aria-label="气泡停留时间">
          <button type="button" class="settings-chip" data-bubble-seconds="5">5 秒</button>
          <button type="button" class="settings-chip" data-bubble-seconds="8">8 秒</button>
          <button type="button" class="settings-chip" data-bubble-seconds="15">15 秒</button>
          <button type="button" class="settings-chip" data-bubble-seconds="0">保持显示</button>
        </div>
        <div class="settings-toggle-row">
          <label class="settings-toggle" for="settings-advance"><input id="settings-advance" type="checkbox"> 点人物继续对话</label>
          <button type="button" class="settings-reset" data-reset-key="advanceOnPetTap" aria-label="重置点人物继续对话">↺</button>
        </div>
        <div class="settings-field">
          <span class="settings-label">气泡偏移 X
            <button type="button" class="settings-reset" data-reset-key="bubbleOffsetX" aria-label="重置气泡偏移 X">↺</button>
          </span>
          <span id="settings-bubble-x-value" class="settings-value">0</span>
          <input id="settings-bubble-x" type="range" min="-48" max="48" step="1" value="0">
        </div>
        <div class="settings-field">
          <span class="settings-label">气泡偏移 Y
            <button type="button" class="settings-reset" data-reset-key="bubbleOffsetY" aria-label="重置气泡偏移 Y">↺</button>
          </span>
          <span id="settings-bubble-y-value" class="settings-value">0</span>
          <input id="settings-bubble-y" type="range" min="-48" max="48" step="1" value="0">
        </div>
      </section>

      <section class="settings-section" data-settings-group="behavior" aria-labelledby="settings-behavior-title">
        <div class="settings-section-head">
          <h3 id="settings-behavior-title">行为</h3>
          <button type="button" class="settings-reset settings-reset-group" data-reset-group="behavior">重置本组</button>
        </div>
        <div class="settings-field">
          <span class="settings-label">闲置动作间隔（秒）
            <button type="button" class="settings-reset" data-reset-key="idleIntervalSec" aria-label="重置闲置动作间隔">↺</button>
          </span>
          <span id="settings-idle-value" class="settings-value">45</span>
          <input id="settings-idle" type="range" min="5" max="300" step="5" value="45">
        </div>
        <div class="settings-toggle-row">
          <label class="settings-toggle" for="settings-mirror"><input id="settings-mirror" type="checkbox" checked> 贴左侧时转向</label>
          <button type="button" class="settings-reset" data-reset-key="mirrorOnLeft" aria-label="重置贴左侧转向">↺</button>
        </div>
        <div class="settings-toggle-row">
          <label class="settings-toggle" for="settings-reduced"><input id="settings-reduced" type="checkbox"> 减少动画</label>
          <button type="button" class="settings-reset" data-reset-key="reducedMotion" aria-label="重置减少动画">↺</button>
        </div>
      </section>

      <section class="settings-section" data-settings-group="visibility" aria-labelledby="settings-visibility-title">
        <div class="settings-section-head">
          <h3 id="settings-visibility-title">显示</h3>
          <button type="button" class="settings-reset settings-reset-group" data-reset-group="visibility">重置本组</button>
        </div>
        <div class="settings-field">
          <span class="settings-label">透明度
            <button type="button" class="settings-reset" data-reset-key="opacity" aria-label="重置透明度">↺</button>
          </span>
          <span id="settings-opacity-value" class="settings-value">100%</span>
          <input id="settings-opacity" type="range" min="0.35" max="1" step="0.05" value="1">
        </div>
      </section>

      <footer class="settings-footer">
        <button type="button" id="settings-reset-all" class="settings-action settings-default">恢复默认</button>
        <p>不会删除自定义台词、已导入皮肤，也不会移动当前位置。</p>
      </footer>
    </aside>
  </main>
</body>
</html>
