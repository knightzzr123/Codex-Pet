<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self'; script-src 'self'; connect-src 'none'">
  <title>大肥鱼 · Codex 额度小助手</title>
  <link rel="stylesheet" href="style.css">
  <script src="dialogue-data.js" defer></script>
  <script src="renderer.js" defer></script>
</head>
<body class="no-bubble">
  <main id="mascot" aria-label="Codex 窗口内额度角色">
    <div id="speech-anchor">
      <section id="bubble" class="interactive" tabindex="0" aria-label="鲸鱼娘对话和 Codex 额度，按回车说下一句，Esc 收起">
        <div id="dialogue-view" class="bubble-panel dialogue-view" inert aria-hidden="true">
          <button id="dialogue-next" aria-label="听鲸鱼娘说下一句">
            <span class="speaker">鲸鱼娘</span>
            <span id="dialogue" role="status" aria-live="polite">主人，戳戳我嘛～</span>
          </button>
        </div>
        <div id="quota-view" class="bubble-panel quota-view is-active" aria-hidden="false">
          <div class="heading"><span class="status-dot" id="status-dot"></span>Codex 剩余额度</div>
          <div class="hero-line" role="status" aria-live="polite" aria-atomic="true"><span id="remaining">—</span><span id="percent">%</span></div>
          <div id="period">正在读取账户额度</div>
          <div id="other-windows"></div>
          <div id="reset" class="reset">连接本机 Codex…</div>
          <div class="meta"><span id="updated">首次读取</span><button id="refresh" title="刷新额度" aria-label="刷新 Codex 额度">↻</button></div>
        </div>
      </section>
      <div class="thought-dot dot-one" aria-hidden="true"></div>
      <div class="thought-dot dot-two" aria-hidden="true"></div>
    </div>
    <span id="reaction" aria-hidden="true">♡</span>
    <button id="pet" class="interactive" aria-label="点击查看额度，点击气泡说话，按住拖动，右键或触摸长按打开菜单" title="点击看额度 · 点气泡和我说话 · 按住拖动 · 右键或触摸长按打开菜单">
      <img id="pet-image" src="../assets/pet.png" alt="蓝发 Q 版女仆角色" draggable="false">
    </button>
    <aside id="settings-panel" class="settings-panel" hidden aria-hidden="true" aria-label="桌宠设置">
      <header class="settings-header">
        <h2>设置</h2>
        <button type="button" id="settings-close" class="settings-close" aria-label="关闭设置">×</button>
      </header>
      <section class="settings-section" aria-labelledby="settings-skins-title">
        <h3 id="settings-skins-title">皮肤</h3>
        <div id="settings-skins" class="settings-row settings-skins"></div>
        <button type="button" id="settings-import-skin" class="settings-action">导入图片…</button>
      </section>
      <section class="settings-section" aria-labelledby="settings-size-title">
        <h3 id="settings-size-title">大小</h3>
        <div id="settings-size" class="settings-size" role="radiogroup" aria-label="角色大小"></div>
      </section>
      <section class="settings-section" aria-labelledby="settings-dialogue-title">
        <h3 id="settings-dialogue-title">台词</h3>
        <button type="button" id="settings-edit-dialogues" class="settings-action">编辑台词…</button>
      </section>
      <section class="settings-section" aria-labelledby="settings-custom-title">
        <h3 id="settings-custom-title">自定义</h3>
        <label class="settings-field">气泡偏移 X
          <input id="settings-bubble-x" type="range" min="-48" max="48" step="1" value="0">
          <span id="settings-bubble-x-value">0</span>
        </label>
        <label class="settings-field">气泡偏移 Y
          <input id="settings-bubble-y" type="range" min="-48" max="48" step="1" value="0">
          <span id="settings-bubble-y-value">0</span>
        </label>
        <label class="settings-field">闲置动作间隔（秒）
          <input id="settings-idle" type="range" min="5" max="300" step="5" value="45">
          <span id="settings-idle-value">45</span>
        </label>
        <label class="settings-field">透明度
          <input id="settings-opacity" type="range" min="0.35" max="1" step="0.05" value="1">
          <span id="settings-opacity-value">100%</span>
        </label>
      </section>
    </aside>
  </main>
</body>
</html>
